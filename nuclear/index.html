<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>核能晨報 · Nuclear Daily Brief</title>
<meta name="description" content="每日巡檢核能動態，依核子安全、核子保安、核子保防三個規範體系分節，附機組狀態速覽與未來事件行事曆。">
<meta name="theme-color" content="#141b2b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="../icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<style>
  /* Six reader-selectable themes. Every colour flows through these tokens so a
     theme swap is one attribute change on <html>, never a rewrite. */
  :root, :root[data-skin="news"] {          /* 報紙白 */
    color-scheme: light;
    --bg:#f7f4ed; --tx:#1f1c18; --mut:#6b6459; --line:#ddd6c8;
    --acc:#1c3f6e; --acc-h:#16345c; --acc-fg:#fff; --link:#1c3f6e; --link-h:#2d5a94;
    --strong:#8c2f1f; --chip:#e9e3d6; --chip-h:#ded7c8; --th:#efe9dc; --mark:#dfe7f1;
    --head:#1c3f6e; --card:#fffdf8;
  }
  :root[data-skin="ink"] {                  /* 深墨綠 */
    color-scheme: dark;
    --bg:#121212; --tx:#e8e6e1; --mut:#8a9490; --line:#2f3a36;
    --acc:#004030; --acc-h:#005a44; --acc-fg:#fff; --link:#7fd1b9; --link-h:#a8e6d4;
    --strong:#fff; --chip:#1e2422; --chip-h:#2a3230; --th:#1a201e; --mark:#004030;
    --head:#7fd1b9; --card:#181a19;
  }
  :root[data-skin="navy"] {                 /* 學術藏青 */
    color-scheme: dark;
    --bg:#141b2b; --tx:#e4e6ec; --mut:#8c94a8; --line:#2a3348;
    --acc:#e8c37a; --acc-h:#d9ae5c; --acc-fg:#141b2b; --link:#e8c37a; --link-h:#f2d79b;
    --strong:#fff; --chip:#1c2438; --chip-h:#252f47; --th:#1a2234; --mark:#2a3348;
    --head:#e8c37a; --card:#1a2133;
  }
  :root[data-skin="warm"] {                 /* 暖灰單色 */
    color-scheme: dark;
    --bg:#1a1917; --tx:#e5e2dc; --mut:#8f8a80; --line:#33312d;
    --acc:#b8632a; --acc-h:#a3551f; --acc-fg:#fff; --link:#d8834a; --link-h:#e8a274;
    --strong:#fff; --chip:#232220; --chip-h:#2e2c29; --th:#211f1d; --mark:#3a2f26;
    --head:#d8834a; --card:#201f1c;
  }
  :root[data-skin="crimson"] {              /* 校色紅 */
    color-scheme: light;
    --bg:#fdfcfb; --tx:#191919; --mut:#6e6a67; --line:#e2dedb;
    --acc:#9b1b23; --acc-h:#84161d; --acc-fg:#fff; --link:#9b1b23; --link-h:#c02730;
    --strong:#191919; --chip:#f0ecea; --chip-h:#e5e0dd; --th:#f5f2f0; --mark:#f6e0e1;
    --head:#9b1b23; --card:#ffffff;
  }
  /* 隨系統：淺色用報紙白、深色用深墨綠 */
  :root[data-skin="auto"] {
    color-scheme: light dark;
    --bg:#f7f4ed; --tx:#1f1c18; --mut:#6b6459; --line:#ddd6c8;
    --acc:#1c3f6e; --acc-h:#16345c; --acc-fg:#fff; --link:#1c3f6e; --link-h:#2d5a94;
    --strong:#8c2f1f; --chip:#e9e3d6; --chip-h:#ded7c8; --th:#efe9dc; --mark:#dfe7f1;
    --head:#1c3f6e; --card:#fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="auto"] {
      --bg:#121212; --tx:#e8e6e1; --mut:#8a9490; --line:#2f3a36;
      --acc:#004030; --acc-h:#005a44; --acc-fg:#fff; --link:#7fd1b9; --link-h:#a8e6d4;
      --strong:#fff; --chip:#1e2422; --chip-h:#2a3230; --th:#1a201e; --mark:#004030;
      --head:#7fd1b9; --card:#181a19;
    }
  }

  /* 三個規範欄位各有定色。核子安全、保安、保防是不同的規範體系，不是同一件事的三種說法，
     配色的作用是讓讀者每天看見同一組區分。 */
  :root { --safety:#1c6b4a; --security:#8c2f1f; --safeg:#5b4b8a; --industry:#6b6459; }
  :root[data-skin="ink"], :root[data-skin="navy"], :root[data-skin="warm"] {
    --safety:#4fb98a; --security:#e08573; --safeg:#a99ae0; --industry:#8a9490;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-skin="auto"] { --safety:#4fb98a; --security:#e08573; --safeg:#a99ae0; --industry:#8a9490; }
  }

  /* 漲紅跌綠：台灣與東亞慣例，六個指數一律適用，不因美股原地慣例而分歧 */
  :root { --up:#c8102e; --down:#00794d; }
  :root[data-skin="ink"], :root[data-skin="navy"], :root[data-skin="warm"] { --up:#ff6b6b; --down:#3fbf8f; }
  @media (prefers-color-scheme: dark) { :root[data-skin="auto"] { --up:#ff6b6b; --down:#3fbf8f; } }

  body { font-family:'Noto Serif TC','Inter',ui-serif,serif; background:var(--bg); color:var(--tx); }
  td.up { color:var(--up); font-weight:600; }
  td.down { color:var(--down); font-weight:600; }
  td.changed { color:var(--up); font-weight:600; }
  td.same { color:var(--mut); }
  .hdr { background:color-mix(in srgb, var(--bg) 92%, transparent); border-bottom:1px solid var(--line); }
  .btn { background:var(--chip); color:var(--tx); }
  .btn:hover { background:var(--chip-h); }
  .btn-on { background:var(--acc); color:var(--acc-fg); }
  .muted { color:var(--mut); }

  .prose-brief { line-height:1.9; }
  .prose-brief h2 { font-size:1.25rem; font-weight:700; margin:2.5rem 0 .75rem; padding-bottom:.5rem;
                    border-bottom:1px solid var(--line); color:var(--head); }
  .prose-brief h3 { font-size:1.05rem; font-weight:700; margin:2rem 0 .6rem; color:var(--tx); }
  .prose-brief p { margin:.85rem 0; }
  .prose-brief ul { margin:.85rem 0; padding-left:1.25rem; list-style:disc; }
  .prose-brief li { margin:.4rem 0; }
  .prose-brief a { color:var(--link); text-decoration:underline; text-underline-offset:2px; word-break:break-word; }
  .prose-brief a:hover { color:var(--link-h); }
  .prose-brief strong { color:var(--strong); font-weight:700; }
  .prose-brief hr { border:0; border-top:1px solid var(--line); margin:2rem 0; }
  .prose-brief code { background:var(--chip); padding:.15em .4em; border-radius:.25rem; font-size:.9em; }
  .prose-brief table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.92rem;
                       display:block; overflow-x:auto; font-variant-numeric:tabular-nums; }
  .prose-brief th, .prose-brief td { border:1px solid var(--line); padding:.5rem .7rem; text-align:left; }
  .prose-brief th { background:var(--th); }
  /* Each news item becomes a card: the H3 headline plus everything up to the
     next heading. Built at render time so the Markdown stays plain text. */
  /* a section paints its own accent onto the H2 and every card inside it */
  .prose-brief h2[data-regime] { border-bottom-color:var(--regime); color:var(--regime); }
  .prose-brief h2[data-regime]::before {
    content:''; display:inline-block; width:.55rem; height:.55rem; border-radius:2px;
    background:var(--regime); margin-right:.5rem; vertical-align:.08em;
  }
  section.card[data-regime] { border-left-color:var(--regime); }
  .card { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--head);
          border-radius:4px; padding:1rem 1.15rem; margin:1.1rem 0; }
  .card > h3 { margin-top:0 !important; }
  .card > :last-child { margin-bottom:0; }
  .card ul { margin:.7rem 0 0; padding-left:1.1rem; font-size:.88rem; }
  .card ul li { color:var(--mut); }
  .card ul li strong { color:var(--mut); }
  /* source grade badge: reliability visible before reading, not after */
  .grade { display:inline-block; font-family:ui-sans-serif,system-ui,sans-serif; font-size:.62rem;
           font-weight:700; letter-spacing:.06em; padding:.1rem .4rem; border-radius:3px;
           vertical-align:.12em; margin-right:.4rem; }
  .g-A { background:#1c6b4a; color:#fff; }
  .g-B { background:var(--head); color:var(--bg); }
  .g-C { background:#8a6d3b; color:#fff; }

  /* one-line summary: the reader's exit point if they read nothing else */
  .lede { font-size:.95rem; line-height:1.7; margin:.1rem 0 .8rem; padding:.5rem .75rem;
          background:var(--th); border-left:2px solid var(--head); color:var(--tx); }

  /* fact vs analysis, made visible */
  .seg { font-family:ui-sans-serif,system-ui,sans-serif; font-size:.62rem; font-weight:700;
         letter-spacing:.16em; color:var(--mut); margin:.9rem 0 .25rem; }
  .card > details { margin-top:.6rem; }
  .card > details > summary { cursor:pointer; font-family:ui-sans-serif,system-ui,sans-serif;
         font-size:.75rem; color:var(--head); list-style:none; padding:.3rem 0; }
  .card > details > summary::-webkit-details-marker { display:none; }
  .card > details > summary::before { content:'▸ '; }
  .card > details[open] > summary::before { content:'▾ '; }

  /* today's summary block */
  .digest { border:1px solid var(--line); border-top:3px solid var(--head); background:var(--card);
            padding:1rem 1.15rem; margin:0 0 1.6rem; }
  .digest h2 { margin:0 0 .6rem !important; border:0 !important; padding:0 !important; font-size:1.05rem; }

  /* legend: the three regimes, defined once at the top of every brief */
  .legend { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1.6rem;
            font-family:ui-sans-serif,system-ui,sans-serif; font-size:.7rem; }
  .legend b { display:inline-flex; align-items:center; gap:.35rem; font-weight:600;
              border:1px solid var(--line); background:var(--card);
              border-radius:999px; padding:.25rem .6rem; }
  .legend b i { width:.5rem; height:.5rem; border-radius:2px; font-style:normal; }
  .legend span { color:var(--mut); font-weight:400; }

  /* reading progress + back to top */
  #bar { position:fixed; top:0; left:0; height:2px; background:var(--head); z-index:40; width:0; }
  #totop { position:fixed; right:1rem; bottom:1rem; z-index:30; display:none;
           width:2.6rem; height:2.6rem; border-radius:50%; border:1px solid var(--line);
           background:var(--card); color:var(--tx); font-size:1rem; cursor:pointer; }
  #totop.on { display:block; }

  @media (max-width:640px) {
    body { font-size:18px; }
    .prose-brief { line-height:1.9; }
    .prose-brief h3 { font-size:1rem; }
    .card { padding:.8rem .85rem; }
  }

  .speaking { background:var(--mark); border-radius:.25rem; }
  ::selection { background:var(--mark); }
  :focus-visible { outline:2px solid var(--link); outline-offset:2px; }
</style>

<div id="bar"></div>
<button id="totop" aria-label="回到頂端">↑</button>

<div class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-20 backdrop-blur hdr">
    <div class="max-w-3xl mx-auto px-4 py-2.5">

      <!-- one row: brand, date, read-aloud, speed, theme -->
      <div class="flex items-center gap-2 flex-wrap font-sans text-xs">
        <h1 class="text-base font-bold shrink-0" style="font-family:'Noto Serif TC',serif">核能晨報</h1>
        <span id="hdrdate" class="muted shrink-0"></span>

        <button id="play" class="btn-on px-2.5 py-1 rounded shrink-0">▶ 朗讀</button>
        <button id="gear" class="btn px-2 py-1 rounded shrink-0 ml-auto" aria-expanded="false"
                aria-controls="settings" title="設定">⚙</button>
      </div>

      <div id="settings" class="hidden mt-2 flex items-center gap-2 flex-wrap font-sans text-xs">
        <button id="stop" class="btn px-2 py-1 rounded" aria-label="停止朗讀">■ 停止</button>
        <span class="muted">語速</span>
        <div class="flex gap-1" id="rates"></div>
        <label class="flex items-center gap-1 ml-auto">
          <span class="muted">風格</span>
          <select id="skin" class="btn rounded px-1.5 py-1 border" style="border-color:var(--line)"
                  aria-label="選擇版面風格">
            <option value="news">報紙白</option>
            <option value="ink">深墨綠</option>
            <option value="navy">學術藏青</option>
            <option value="warm">暖灰單色</option>
            <option value="crimson">校色紅</option>
            <option value="auto">隨系統</option>
          </select>
        </label>
      </div>

      <div class="mt-2 flex items-center gap-2 font-sans">
        <button id="prev" class="btn px-2.5 py-1.5 rounded disabled:opacity-30 disabled:cursor-not-allowed text-sm" aria-label="前一天">&lsaquo;</button>
        <select id="picker" class="btn flex-1 min-w-0 rounded px-2 py-1.5 text-sm border" style="border-color:var(--line)" aria-label="選擇日期"></select>
        <button id="next" class="btn px-2.5 py-1.5 rounded disabled:opacity-30 disabled:cursor-not-allowed text-sm" aria-label="後一天">&rsaquo;</button>
      </div>

      <nav id="topicnav" class="mt-2 flex gap-1.5 overflow-x-auto font-sans text-xs pb-0.5"
           aria-label="主題導覽"></nav>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6">
    <article id="content" class="prose-brief"><p class="muted">載入中…</p></article>
  </main>

  <footer class="py-6 text-center text-xs muted font-sans px-4" style="border-top:1px solid var(--line)">
    <p>本報彙整公開資訊，非投資或決策建議。本報不倡議擁核或反核，只報事實與其後果。</p>
    <p class="mt-1"><a href="../" style="color:var(--link)">← 實踐國企晨報（母站）</a></p>
    <p class="mt-1">實踐大學高雄校區 國際企業管理學系</p>
  </footer>
</div>

<script>
const contentEl = document.getElementById('content');
const picker = document.getElementById('picker');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const playBtn = document.getElementById('play');
const stopBtn = document.getElementById('stop');

let briefs = [];   // newest first
let idx = 0;
let rate = 1.0;

marked.setOptions({ gfm: true, breaks: false });

// ---------- rendering ----------
async function loadManifest() {
  const res = await fetch('briefs/manifest.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('manifest ' + res.status);
  const data = await res.json();
  briefs = (data.briefs || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  picker.innerHTML = briefs
    .map((b, i) => '<option value="' + i + '">' + b.date + '（' + weekday(b.date) + '）</option>')
    .join('');
}

function weekday(iso) {
  const d = new Date(iso + 'T00:00:00');
  return '日一二三四五六'[d.getDay()];
}

async function show(i) {
  stopSpeech();
  idx = Math.max(0, Math.min(briefs.length - 1, i));
  picker.value = idx;
  prevBtn.disabled = idx >= briefs.length - 1;   // no older brief
  nextBtn.disabled = idx <= 0;                   // no newer brief
  contentEl.innerHTML = '<p class="muted">載入中…</p>';
  try {
    const res = await fetch('briefs/' + briefs[idx].file, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    contentEl.innerHTML = DOMPurify.sanitize(marked.parse(md), { ADD_ATTR: ['target'] });
    // the brief repeats its own title; the header already shows it
    const dup = contentEl.querySelector('h1');
    if (dup) dup.remove();
    contentEl.querySelectorAll('a[href^="http"]').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
    colourStatusTable();
    groupIntoCards();
    styleDigest();
    paintRegimes();
    buildLegend();
    paintProgress();
    buildTopicNav();
    window.scrollTo({ top: 0 });
    document.getElementById('hdrdate').textContent =
      briefs[idx].date + '（' + weekday(briefs[idx].date) + '）';
    history.replaceState(null, '', '#' + briefs[idx].date);
  } catch (e) {
    contentEl.innerHTML = '<p style="color:var(--strong)">讀取失敗：' + e.message + '</p>';
  }
}

// ---------- reactor status table ----------
// The nuclear brief opens with 機組狀態速覽 rather than a market table. Mark the
// 較昨日 column so a state change reads at a glance and an unchanged row recedes.
// Identified by its headers, never by position: the digest opens with a
// calendar table, so this is not the first table in the document.
function colourStatusTable() {
  const heads0 = t => [...t.querySelectorAll('th')].map(h => h.textContent.trim());
  const t = [...contentEl.querySelectorAll('table')]
    .find(x => heads0(x).some(h => /較昨日/.test(h)));
  if (!t) return;
  const heads = heads0(t);
  t.querySelectorAll('tr').forEach(function (tr) {
    tr.querySelectorAll('td').forEach(function (td, i) {
      if (!/較昨日/.test(heads[i] || '')) return;
      const v = td.textContent.trim();
      if (v === '—' || v === '-' || v === '') td.className = 'same';
      else td.className = 'changed';
    });
  });
}

// ---------- regimes ----------
// 核子安全、核子保安、核子保防 are three distinct regulatory regimes with different
// legal bases — safeguards derive from agreements, security from a national threat
// assessment, and neither adds to nor subtracts from the other. The brief keeps them
// in separate sections; the page gives each its own colour so the distinction is
// visible before a word is read. Matched on the heading text, so a brief that omits
// a section simply renders without that colour rather than breaking.
const REGIMES = [
  { key: 'safety',   test: /核子安全/,   label: '核子安全', en: 'safety',     hint: '針對意外與失效' },
  { key: 'security', test: /核子保安/,   test2: /保安/, label: '核子保安', en: 'security', hint: '針對惡意行為者' },
  { key: 'safeg',    test: /核子保防/,   label: '核子保防', en: 'safeguards', hint: '針對移作他用' },
  { key: 'industry', test: /核能相關動態/, label: '相關動態', en: '', hint: '產業與政策面' }
];

function regimeOf(text) {
  for (const r of REGIMES) if (r.test.test(text)) return r;
  return null;
}

// Paint each H2 and every card beneath it with that section's accent.
function paintRegimes() {
  contentEl.querySelectorAll('h2').forEach(function (h) {
    const r = regimeOf(h.textContent);
    if (!r) return;
    h.dataset.regime = r.key;
    h.style.setProperty('--regime', 'var(--' + r.key + ')');
    for (let n = h.nextElementSibling; n && n.tagName !== 'H2'; n = n.nextElementSibling) {
      if (n.classList && n.classList.contains('card')) {
        n.dataset.regime = r.key;
        n.style.setProperty('--regime', 'var(--' + r.key + ')');
      }
    }
  });
}

// The legend defines the three regimes once per brief, directly under the digest.
// Only the regimes actually present are listed, so it never promises a section
// the brief does not contain.
function buildLegend() {
  const present = REGIMES.filter(function (r) {
    return [...contentEl.querySelectorAll('h2')].some(function (h) { return r.test.test(h.textContent); });
  }).filter(function (r) { return r.key !== 'industry'; });
  if (present.length < 2) return;                 // a legend for one item explains nothing
  const box = document.createElement('div');
  box.className = 'legend';
  box.innerHTML = present.map(function (r) {
    return '<b><i style="background:var(--' + r.key + ')"></i>' + r.label +
           '<span>' + r.hint + '</span></b>';
  }).join('');
  const digest = contentEl.querySelector('.digest');
  if (digest) digest.insertAdjacentElement('afterend', box);
  else contentEl.insertBefore(box, contentEl.firstChild);
}

// ---------- cards ----------
// Wrap every H3 and the nodes that follow it, up to the next heading or rule,
// so each news item reads as one contained unit.
function groupIntoCards() {
  contentEl.querySelectorAll('h3').forEach(function (h) {
    if (h.parentElement !== contentEl) return;          // already wrapped
    const card = document.createElement('section');
    card.className = 'card';
    h.parentNode.insertBefore(card, h);
    card.appendChild(h);                                // the headline itself
    let n = card.nextElementSibling;                    // then its body
    while (n && !/^(H1|H2|H3|HR)$/.test(n.tagName)) {
      const next = n.nextElementSibling;
      card.appendChild(n);
      n = next;
    }
    structureCard(card);
  });
}

// Pull the reliability grade out of the headline and show it as a badge.
// Written as 〔A〕/〔B〕/〔C〕 in the Markdown; absent on older briefs, which
// simply render without a badge rather than breaking.
function extractGrade(card) {
  const h = card.querySelector('h3');
  if (!h) return;
  const m = h.textContent.match(/〔([ABC])〕/);
  if (!m) return;
  h.textContent = h.textContent.replace('〔' + m[1] + '〕', '').replace(/\s{2,}/g, ' ');
  const b = document.createElement('span');
  b.className = 'grade g-' + m[1];
  b.textContent = m[1];
  b.title = { A: '管制機關文件、法規原文、電力公司重訊、IAEA 官方文件、通訊社直發',
              B: '具署名的專業媒體（WNN、ANS、NucNet、韓聯社、JAIF）',
              C: '二手轉載、未署名報導、產業協會之立場性宣稱' }[m[1]];
  h.insertBefore(b, h.firstChild);
}

// Separate what happened from what we think about it. The brief writes the
// analysis as a paragraph opening in bold, so that is the split point.
function structureCard(card) {
  extractGrade(card);

  // a blockquote directly after the headline is the one-line summary
  const first = card.querySelector('h3 + blockquote');
  if (first) {
    const l = document.createElement('p');
    l.className = 'lede';
    l.textContent = first.textContent.replace(/^一句話摘要[:：]\s*/, '').trim();
    first.replaceWith(l);
  }

  const kids = [...card.children];
  const paras = kids.filter(function (n) { return n.tagName === 'P' && !n.classList.contains('lede'); });
  if (!paras.length) return;

  // the analysis paragraph is the first one that starts with bold text
  const judged = paras.find(function (n) {
    const f = n.firstElementChild;
    return f && f.tagName === 'STRONG' && n.textContent.trim().startsWith(f.textContent.trim());
  });

  if (judged && paras[0] !== judged) {
    card.insertBefore(seg('事實'), paras[0]);
    card.insertBefore(seg('判讀'), judged);
  }

  // sources and caveats fold away; they matter, but not on first read
  const list = card.querySelector('ul');
  if (list && /來源|待查核/.test(list.textContent)) {
    const d = document.createElement('details');
    const sm = document.createElement('summary');
    const cav = (list.textContent.match(/待查核/g) || []).length;
    sm.textContent = '來源與待查核' + (cav ? '（' + cav + ' 項待查核）' : '');
    d.appendChild(sm);
    list.parentNode.insertBefore(d, list);
    d.appendChild(list);
  }
}

function seg(label) {
  const d = document.createElement('div');
  d.className = 'seg';
  d.textContent = label;
  return d;
}

// The digest is the reader's three-minute exit. Lift it out of the prose flow.
function styleDigest() {
  const h = [...contentEl.querySelectorAll('h2')]
    .find(function (x) { return /今日三分鐘摘要|今日摘要/.test(x.textContent); });
  if (!h) return;
  const box = document.createElement('section');
  box.className = 'digest';
  h.parentNode.insertBefore(box, h);
  box.appendChild(h);
  let n = box.nextElementSibling;
  while (n && n.tagName !== 'H2' && n.tagName !== 'HR') {
    const next = n.nextElementSibling;
    box.appendChild(n);
    n = next;
  }
}

// ---------- topic navigation ----------
// Built from the rendered H2s, so it follows whatever topics the brief
// actually contains rather than a hard-coded list.
const topicNav = document.getElementById('topicnav');
let sections = [];

function shortLabel(text) {
  // 「主題一：國際企業」-> 「國際企業」（母站遺留格式）; other headings keep their own text
  const m = text.match(/^主題[一二三四五六七八九十]+[：:]\s*(.+)$/);
  return m ? m[1] : text;
}

function buildTopicNav() {
  sections = [];
  topicNav.innerHTML = '';
  const heads = contentEl.querySelectorAll('h2');
  if (!heads.length) { topicNav.classList.add('hidden'); return; }
  topicNav.classList.remove('hidden');

  heads.forEach(function (h, i) {
    h.id = 'sec-' + i;
    const btn = document.createElement('button');
    let n = 0;
    for (let x = h.nextElementSibling; x && x.tagName !== 'H2'; x = x.nextElementSibling) {
      if (x.classList && x.classList.contains('card')) n++;
    }
    btn.textContent = shortLabel(h.textContent.trim()) + (n ? ' ' + n : '');
    btn.dataset.target = i;
    btn.className = 'btn shrink-0 px-2.5 py-1 rounded whitespace-nowrap';
    const r = regimeOf(h.textContent);
    if (r) {                                  // regime sections carry their colour into the nav
      btn.style.borderLeft = '3px solid var(--' + r.key + ')';
    }
    btn.onclick = function () {
      const top = h.getBoundingClientRect().top + window.scrollY
                - document.querySelector('header').offsetHeight - 8;
      window.scrollTo({ top: top, behavior: 'smooth' });
    };
    topicNav.appendChild(btn);
    sections.push({ el: h, btn: btn });
  });
  paintActiveTopic();
}

function paintActiveTopic() {
  if (!sections.length) return;
  const line = document.querySelector('header').offsetHeight + 16;
  let active = 0;
  sections.forEach(function (s, i) {
    if (s.el.getBoundingClientRect().top <= line) active = i;
  });
  sections.forEach(function (s, i) {
    s.btn.className = 'shrink-0 px-2.5 py-1 rounded whitespace-nowrap ' +
      (i === active ? 'btn-on' : 'btn');
  });
  // keep the active chip visible in the scrolling strip
  const a = sections[active].btn;
  const nl = topicNav.scrollLeft, nr = nl + topicNav.clientWidth;
  if (a.offsetLeft < nl || a.offsetLeft + a.offsetWidth > nr) {
    topicNav.scrollTo({ left: a.offsetLeft - 12, behavior: 'smooth' });
  }
}

let navTick = false;
window.addEventListener('scroll', function () {
  if (navTick) return;
  navTick = true;
  requestAnimationFrame(function () { paintActiveTopic(); navTick = false; });
}, { passive: true });

prevBtn.onclick = function () { show(idx + 1); };
nextBtn.onclick = function () { show(idx - 1); };
picker.onchange = function () { show(+picker.value); };
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});

// ---------- text to speech ----------
const synth = window.speechSynthesis;
let chunks = [];
let chunkPos = 0;
let speaking = false;

[0.8, 1.0, 1.5, 2.0].forEach(function (r) {
  const b = document.createElement('button');
  b.textContent = r.toFixed(1) + '×';
  b.dataset.rate = r;
  b.onclick = function () {
    rate = r;
    paintRates();
    if (speaking) { const p = chunkPos; stopSpeech(); speakFrom(p); }
  };
  document.getElementById('rates').appendChild(b);
});

function paintRates() {
  document.querySelectorAll('#rates button').forEach(function (b) {
    b.className = 'px-2 py-1 rounded ' +
      (+b.dataset.rate === rate ? 'btn-on' : 'btn');
  });
}
paintRates();

function buildChunks() {
  // read only the rendered article text, split into speakable units
  chunks = [];
  contentEl.querySelectorAll('h1, h2, h3, p, li').forEach(function (el) {
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (!t) return;
    if (/^(來源|待查核)[:：]/.test(t)) return;   // skip link dumps and caveat lists
    const parts = t.match(/[^。！？!?]{1,180}[。！？!?]?/g) || [t];
    parts.forEach(function (s) {
      const v = s.trim();
      if (v) chunks.push({ text: v, el: el });
    });
  });
}

function speakFrom(pos) {
  if (!synth) return;
  if (!chunks.length) buildChunks();
  if (!chunks.length) return;
  chunkPos = pos;
  speaking = true;
  playBtn.textContent = '❚❚ 暫停';
  speakNext();
}

function pickVoice() {
  const voices = synth.getVoices();
  return voices.find(function (v) { return /zh[-_]TW|cmn-Hant/i.test(v.lang); })
      || voices.find(function (v) { return /^zh/i.test(v.lang); })
      || null;
}

function speakNext() {
  if (!speaking) return;
  if (chunkPos >= chunks.length) { stopSpeech(); return; }
  const c = chunks[chunkPos];
  const u = new SpeechSynthesisUtterance(c.text);
  u.lang = 'zh-TW';
  u.rate = rate;
  const v = pickVoice();
  if (v) u.voice = v;
  u.onstart = function () {
    contentEl.querySelectorAll('.speaking').forEach(function (e) { e.classList.remove('speaking'); });
    c.el.classList.add('speaking');
    c.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  };
  u.onend = function () {
    if (!speaking) return;
    chunkPos++;
    speakNext();
  };
  synth.speak(u);
}

function stopSpeech() {
  speaking = false;
  chunks = [];
  chunkPos = 0;
  if (synth) synth.cancel();
  playBtn.textContent = '▶ 朗讀';
  contentEl.querySelectorAll('.speaking').forEach(function (e) { e.classList.remove('speaking'); });
}

playBtn.onclick = function () {
  if (!synth) { alert('此瀏覽器不支援語音朗讀。'); return; }
  if (speaking) { speaking = false; synth.pause(); playBtn.textContent = '▶ 繼續'; return; }
  if (synth.paused && chunks.length) { speaking = true; synth.resume(); playBtn.textContent = '❚❚ 暫停'; return; }
  buildChunks();
  speakFrom(0);
};
stopBtn.onclick = stopSpeech;
window.addEventListener('beforeunload', function () { if (synth) synth.cancel(); });
if (synth) synth.onvoiceschanged = function () {};

// ---------- chrome: settings, progress, back to top ----------
const gear = document.getElementById('gear');
const settings = document.getElementById('settings');
gear.onclick = function () {
  const open = settings.classList.toggle('hidden') === false;
  gear.setAttribute('aria-expanded', String(open));
};

const bar = document.getElementById('bar');
const toTop = document.getElementById('totop');
toTop.onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };

function paintProgress() {
  const h = document.documentElement.scrollHeight - window.innerHeight;
  bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
  toTop.classList.toggle('on', window.scrollY > 600);
}
window.addEventListener('scroll', paintProgress, { passive: true });
window.addEventListener('resize', paintProgress);

// ---------- theme ----------
// The choice is the reader's, so it persists across visits.
const skinSel = document.getElementById('skin');
const SKIN_KEY = 'nuclear-skin';   // namespaced: both sites share one origin

function applySkin(v) {
  document.documentElement.dataset.skin = v;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    meta.content = getComputedStyle(document.documentElement)
      .getPropertyValue('--bg').trim() || '#f7f4ed';
  }
}

skinSel.onchange = function () {
  applySkin(skinSel.value);
  try { localStorage.setItem(SKIN_KEY, skinSel.value); } catch (e) {}
};

(function initSkin() {
  let v = 'news';
  try { v = localStorage.getItem(SKIN_KEY) || 'navy'; } catch (e) {}
  if (!skinSel.querySelector('option[value="' + v + '"]')) v = 'news';
  skinSel.value = v;
  applySkin(v);
})();

// ---------- boot ----------
(async function () {
  try {
    await loadManifest();
    if (!briefs.length) {
      contentEl.innerHTML = '<p class="text-[#6b6459]">尚無晨報。</p>';
      return;
    }
    const want = location.hash.replace('#', '');
    const at = briefs.findIndex(function (b) { return b.date === want; });
    await show(at >= 0 ? at : 0);
  } catch (e) {
    contentEl.innerHTML = '<p style="color:var(--strong)">無法載入索引：' + e.message + '</p>';
  }
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
