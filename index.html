<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>實踐晨報 · KH USC IBM's Daily Brief</title>
<meta name="description" content="每日巡檢：兩岸、東南亞、日本、無人載具、人工智慧、財稅與會計政策。">
<meta name="theme-color" content="#004030">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

<style>
  :root { color-scheme: dark; }
  body { font-family: 'Noto Serif TC', 'Inter', ui-serif, serif; background:#121212; color:#e8e6e1; }
  .prose-brief { line-height: 1.9; }
  .prose-brief h1 { font-size:1.6rem; font-weight:700; margin:0 0 1rem; color:#fff; }
  .prose-brief h2 { font-size:1.25rem; font-weight:700; margin:2.5rem 0 .75rem; padding-bottom:.5rem;
                    border-bottom:1px solid #2f3a36; color:#7fd1b9; }
  .prose-brief h3 { font-size:1.05rem; font-weight:600; margin:2rem 0 .6rem; color:#fff; }
  .prose-brief p { margin:.85rem 0; }
  .prose-brief ul { margin:.85rem 0; padding-left:1.25rem; list-style:disc; }
  .prose-brief li { margin:.4rem 0; }
  .prose-brief a { color:#7fd1b9; text-decoration:underline; text-underline-offset:2px; word-break:break-word; }
  .prose-brief a:hover { color:#a8e6d4; }
  .prose-brief strong { color:#fff; font-weight:700; }
  .prose-brief hr { border:0; border-top:1px solid #2f3a36; margin:2rem 0; }
  .prose-brief code { background:#1e2422; padding:.15em .4em; border-radius:.25rem; font-size:.9em; }
  .prose-brief table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.92rem; display:block; overflow-x:auto; }
  .prose-brief th, .prose-brief td { border:1px solid #2f3a36; padding:.5rem .7rem; text-align:left; }
  .prose-brief th { background:#1a201e; }
  .speaking { background:#004030; border-radius:.25rem; }
  ::selection { background:#004030; }
</style>

<div class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-20 backdrop-blur bg-[#121212]/90 border-b border-[#2f3a36]">
    <div class="max-w-3xl mx-auto px-4 py-3">
      <div class="flex items-baseline justify-between gap-3">
        <h1 class="text-base sm:text-lg font-bold text-white">實踐晨報</h1>
        <span class="text-xs text-[#8a9490] font-sans">KH USC IBM&rsquo;s Daily Brief</span>
      </div>

      <div class="mt-3 flex items-center gap-2 font-sans">
        <button id="prev" class="px-2.5 py-1.5 rounded bg-[#1e2422] hover:bg-[#2a3230] disabled:opacity-30 disabled:cursor-not-allowed text-sm" aria-label="前一天">&lsaquo;</button>
        <select id="picker" class="flex-1 min-w-0 bg-[#1e2422] rounded px-2 py-1.5 text-sm text-[#e8e6e1] border border-[#2f3a36]" aria-label="選擇日期"></select>
        <button id="next" class="px-2.5 py-1.5 rounded bg-[#1e2422] hover:bg-[#2a3230] disabled:opacity-30 disabled:cursor-not-allowed text-sm" aria-label="後一天">&rsaquo;</button>
      </div>

      <div class="mt-2 flex items-center gap-2 font-sans text-xs" id="ttsbar">
        <button id="play" class="px-3 py-1.5 rounded bg-[#004030] hover:bg-[#005a44] text-white">▶ 朗讀</button>
        <button id="stop" class="px-3 py-1.5 rounded bg-[#1e2422] hover:bg-[#2a3230]">■</button>
        <div class="flex gap-1 ml-auto" id="rates"></div>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6">
    <article id="content" class="prose-brief"><p class="text-[#8a9490]">載入中…</p></article>
  </main>

  <footer class="border-t border-[#2f3a36] py-6 text-center text-xs text-[#8a9490] font-sans px-4">
    <p>本報彙整公開資訊，非投資或決策建議。</p>
    <p class="mt-1">實踐大學高雄校區 國際企業經營學系</p>
  </footer>
</div>

<script>
const contentEl = document.getElementById('content');
const picker = document.getElementById('picker');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const playBtn = document.getElementById('play');
const stopBtn = document.getElementById('stop');

let briefs = [];   // newest first
let idx = 0;
let rate = 1.0;

marked.setOptions({ gfm: true, breaks: false });

// ---------- rendering ----------
async function loadManifest() {
  const res = await fetch('briefs/manifest.json', { cache: 'no-cache' });
  if (!res.ok) throw new Error('manifest ' + res.status);
  const data = await res.json();
  briefs = (data.briefs || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  picker.innerHTML = briefs
    .map((b, i) => '<option value="' + i + '">' + b.date + '（' + weekday(b.date) + '）</option>')
    .join('');
}

function weekday(iso) {
  const d = new Date(iso + 'T00:00:00');
  return '日一二三四五六'[d.getDay()];
}

async function show(i) {
  stopSpeech();
  idx = Math.max(0, Math.min(briefs.length - 1, i));
  picker.value = idx;
  prevBtn.disabled = idx >= briefs.length - 1;   // no older brief
  nextBtn.disabled = idx <= 0;                   // no newer brief
  contentEl.innerHTML = '<p class="text-[#8a9490]">載入中…</p>';
  try {
    const res = await fetch('briefs/' + briefs[idx].file, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const md = await res.text();
    contentEl.innerHTML = DOMPurify.sanitize(marked.parse(md), { ADD_ATTR: ['target'] });
    contentEl.querySelectorAll('a[href^="http"]').forEach(function (a) {
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
    });
    window.scrollTo({ top: 0 });
    history.replaceState(null, '', '#' + briefs[idx].date);
  } catch (e) {
    contentEl.innerHTML = '<p class="text-red-400">讀取失敗：' + e.message + '</p>';
  }
}

prevBtn.onclick = function () { show(idx + 1); };
nextBtn.onclick = function () { show(idx - 1); };
picker.onchange = function () { show(+picker.value); };
document.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') prevBtn.click();
  if (e.key === 'ArrowRight') nextBtn.click();
});

// ---------- text to speech ----------
const synth = window.speechSynthesis;
let chunks = [];
let chunkPos = 0;
let speaking = false;

[0.8, 1.0, 1.5, 2.0].forEach(function (r) {
  const b = document.createElement('button');
  b.textContent = r.toFixed(1) + '×';
  b.dataset.rate = r;
  b.onclick = function () {
    rate = r;
    paintRates();
    if (speaking) { const p = chunkPos; stopSpeech(); speakFrom(p); }
  };
  document.getElementById('rates').appendChild(b);
});

function paintRates() {
  document.querySelectorAll('#rates button').forEach(function (b) {
    b.className = 'px-2 py-1 rounded ' +
      (+b.dataset.rate === rate ? 'bg-[#004030] text-white' : 'bg-[#1e2422] hover:bg-[#2a3230]');
  });
}
paintRates();

function buildChunks() {
  // read only the rendered article text, split into speakable units
  chunks = [];
  contentEl.querySelectorAll('h1, h2, h3, p, li').forEach(function (el) {
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    if (!t) return;
    if (/^(來源|待查核)[:：]/.test(t)) return;   // skip link dumps and caveat lists
    const parts = t.match(/[^。！？!?]{1,180}[。！？!?]?/g) || [t];
    parts.forEach(function (s) {
      const v = s.trim();
      if (v) chunks.push({ text: v, el: el });
    });
  });
}

function speakFrom(pos) {
  if (!synth) return;
  if (!chunks.length) buildChunks();
  if (!chunks.length) return;
  chunkPos = pos;
  speaking = true;
  playBtn.textContent = '❚❚ 暫停';
  speakNext();
}

function pickVoice() {
  const voices = synth.getVoices();
  return voices.find(function (v) { return /zh[-_]TW|cmn-Hant/i.test(v.lang); })
      || voices.find(function (v) { return /^zh/i.test(v.lang); })
      || null;
}

function speakNext() {
  if (!speaking) return;
  if (chunkPos >= chunks.length) { stopSpeech(); return; }
  const c = chunks[chunkPos];
  const u = new SpeechSynthesisUtterance(c.text);
  u.lang = 'zh-TW';
  u.rate = rate;
  const v = pickVoice();
  if (v) u.voice = v;
  u.onstart = function () {
    contentEl.querySelectorAll('.speaking').forEach(function (e) { e.classList.remove('speaking'); });
    c.el.classList.add('speaking');
    c.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  };
  u.onend = function () {
    if (!speaking) return;
    chunkPos++;
    speakNext();
  };
  synth.speak(u);
}

function stopSpeech() {
  speaking = false;
  chunks = [];
  chunkPos = 0;
  if (synth) synth.cancel();
  playBtn.textContent = '▶ 朗讀';
  contentEl.querySelectorAll('.speaking').forEach(function (e) { e.classList.remove('speaking'); });
}

playBtn.onclick = function () {
  if (!synth) { alert('此瀏覽器不支援語音朗讀。'); return; }
  if (speaking) { speaking = false; synth.pause(); playBtn.textContent = '▶ 繼續'; return; }
  if (synth.paused && chunks.length) { speaking = true; synth.resume(); playBtn.textContent = '❚❚ 暫停'; return; }
  buildChunks();
  speakFrom(0);
};
stopBtn.onclick = stopSpeech;
window.addEventListener('beforeunload', function () { if (synth) synth.cancel(); });
if (synth) synth.onvoiceschanged = function () {};

// ---------- boot ----------
(async function () {
  try {
    await loadManifest();
    if (!briefs.length) {
      contentEl.innerHTML = '<p class="text-[#8a9490]">尚無晨報。</p>';
      return;
    }
    const want = location.hash.replace('#', '');
    const at = briefs.findIndex(function (b) { return b.date === want; });
    await show(at >= 0 ? at : 0);
  } catch (e) {
    contentEl.innerHTML = '<p class="text-red-400">無法載入索引：' + e.message + '</p>';
  }
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
